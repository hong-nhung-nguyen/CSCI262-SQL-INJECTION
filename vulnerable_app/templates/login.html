<!doctype html>
<html>
<head>
  <title>Vulnerable App — Login</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
    input { display:block; margin:8px 0; padding:6px; width:260px; }
    .err { color:#b00; }
    pre { background:#f4f4f4; padding:10px; overflow-x:auto; }
    .banner { background:#ffe8e8; border:1px solid #b00; padding:8px; }
  </style>
</head>
<body>
  <p class="banner">DEMO — intentionally vulnerable. Localhost / VM only.</p>
  <h2>Login</h2>
  <form method="post">
    <input name="username" placeholder="username" autofocus>
    <input name="password" type="password" placeholder="password">
    <button type="submit">Log in</button>
  </form>

  {% if error %}<p class="err">{{ error }}</p>{% endif %}

  {% if query %}
    <p>SQL that was executed:</p>
    <pre>{{ query }}</pre>
  {% endif %}
</body>
</html>
